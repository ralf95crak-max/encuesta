<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu primera impresión</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="Tu primera impresión · 8 minutos">
<meta property="og:description" content="Encuesta anónima sobre la imagen de una marca nueva.">
<style>
:root{
  color-scheme:light;
  --bg:#F4F4F1; --card:#FFFFFF; --ink:#171717; --ink2:#5C5C58; --ink3:#8A8A85;
  --line:#DEDDD7; --soft:#ECEBE6; --err:#B42318; --focus:#2F6FEB;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px}
.bar{height:4px;background:var(--soft);border-radius:2px;overflow:hidden;max-width:560px;margin:0 auto}
.bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .35s ease}
.preview{max-width:560px;margin:8px auto 0;font-size:12px;color:#7A4B00;background:#FFF3D6;border-radius:8px;padding:6px 10px;display:none}
.is-preview .preview{display:block}

main{max-width:560px;margin:0 auto;padding:12px 16px 48px}
.screen{animation:in .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:650;margin:6px 0 8px}
h1{font-size:28px;line-height:1.18;margin:0 0 14px;letter-spacing:-.015em;font-weight:700}
h2{font-size:19px;line-height:1.32;margin:0 0 6px;font-weight:650;letter-spacing:-.005em}
p{margin:0 0 12px}
.lead{font-size:17px;color:var(--ink)}
.help{color:var(--ink2);font-size:14.5px;margin:0 0 12px}
.list{margin:0 0 20px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.list li{display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.list li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--ink);margin-top:9px}

.q{margin:0 0 30px}
.q.has-err h2{color:var(--err)}
.err{color:var(--err);font-size:14px;margin:8px 0 0;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:50px;padding:12px 14px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;cursor:pointer;text-align:left;width:100%;transition:border-color .15s,background .15s}
.opt:hover{border-color:#BDBCB5}
.opt[aria-checked="true"]{border-color:var(--ink);background:#F7F7F4}
.opt[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.mark{flex:none;width:20px;height:20px;border:2px solid #9C9B95;display:grid;place-items:center}
.radio .mark{border-radius:50%}
.check .mark{border-radius:5px}
.opt[aria-checked="true"] .mark{border-color:var(--ink);background:var(--ink)}
.radio .opt[aria-checked="true"] .mark{background:transparent}
.radio .opt[aria-checked="true"] .mark::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.check .opt[aria-checked="true"] .mark::after{content:"";width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:translate(0,-1px) rotate(-45deg)}
.other{margin-top:8px}
.opts.cols2{display:grid;grid-template-columns:1fr 1fr}
.opts.cols3{display:grid;grid-template-columns:1fr 1fr 1fr}

input[type=text],textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input[type=text]:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{min-height:100px;resize:vertical}
.stack{display:flex;flex-direction:column;gap:8px}

.scale{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px}
.scale button{min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:600;cursor:pointer}
.scale button[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.ends{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--ink2);margin-top:6px}
.ends span:last-child{text-align:right}

.sd{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 12px 14px;margin:0 0 10px}
.sd.has-err{border-color:var(--err)}
.sd-ends{display:flex;justify-content:space-between;font-weight:650;font-size:15px;margin:0 2px 10px}
.sd-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:center;justify-items:center}
.sd-dots button{width:100%;max-width:44px;aspect-ratio:1;border-radius:50%;border:2px solid #B9B8B1;background:var(--card);cursor:pointer;padding:0}
.sd-dots button:nth-child(4){border-style:dashed}
.sd-dots button[aria-checked="true"]{background:var(--ink);border-color:var(--ink);border-style:solid}

.btn{appearance:none;border:0;background:var(--ink);color:#fff;font-weight:650;font-size:17px;min-height:54px;border-radius:14px;width:100%;cursor:pointer;margin-top:4px;transition:opacity .15s}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.row-btns{display:flex;flex-direction:column;gap:10px}

.stage{border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin:0 0 22px;position:relative}
.stage.wide{aspect-ratio:16/10}
.stage.square{aspect-ratio:1/1;max-width:300px;margin-left:auto;margin-right:auto}
.stage svg{display:block}
.stage .logo{width:78%}
.stage .iso{width:78%}
.stage.plain{background:transparent;aspect-ratio:auto;padding:28px 0}
.l{fill:var(--letra)} .r{fill:var(--relieve)}

.grid6{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:520px){.grid6{grid-template-columns:repeat(3,1fr)}}
.tile{border-radius:10px;overflow:hidden;line-height:0;border:2px solid transparent;padding:0;background:none;cursor:pointer;position:relative}
.tile svg{width:100%;height:auto;display:block}
.tile[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--ink)}
.tile .num{position:absolute;left:6px;top:6px;background:rgba(255,255,255,.92);color:#171717;font:600 12px/20px system-ui,sans-serif;border-radius:10px;padding:0 7px}

.flash{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.count{font-size:64px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.mask{width:100%;aspect-ratio:16/10;border-radius:16px;background:
  repeating-linear-gradient(45deg,#E4E3DE 0 10px,#EDECE7 10px 20px)}

.colorcard{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px;margin:0 0 14px}
.colorcard.has-err{border-color:var(--err)}
.colorcard .stage{margin:0 0 10px;border-radius:10px;aspect-ratio:2/1}
.colorcard .stage .logo{width:66%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer;min-height:38px}
.chip[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

.picks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:520px){.picks{grid-template-columns:repeat(3,1fr)}}
.pick{border:2px solid transparent;border-radius:12px;overflow:hidden;padding:0;background:none;cursor:pointer;line-height:0}
.pick .stage{margin:0;border-radius:10px;aspect-ratio:16/10}
.pick[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink)}

.reveal{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px 18px 6px;margin:0 0 26px}
.reveal p{display:flex;gap:12px}
.reveal p b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:grid;place-items:center;margin-top:1px}

.center{text-align:center}
.big-ok{width:64px;height:64px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;margin:28px auto 18px;font-size:30px}
details{margin-top:20px;font-size:13px;color:var(--ink2)}
details pre{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:320px;overflow:auto}
.small{font-size:13px;color:var(--ink3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
a.btn.ghost{color:var(--ink)}
a.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.remind{text-align:left;margin-top:26px;padding:18px}
.remind h2{margin-bottom:4px}
.remind .row-btns{margin-top:4px}

</style>
</head>

    {
      id: 'lectura_flash', auto: true,
      render: function (sc) { flash(sc, function () { return stage(ASSETS.logoSinDescriptor, { label: 'Nombre' }); }, 3000, 'lectura'); }
    },
    {
      id: 'lectura',
      render: function (sc) {
        sc.appendChild(h('p', { class: 'kicker', text: 'Lectura' }));
        sc.appendChild(text('lectura_como_suena', '¿Cómo lo dirías en voz alta?', { required: true, help: 'Escríbelo como suena; puedes separar sílabas con guiones.', caps: 'none' }));
        sc.appendChild(scale('lectura_facilidad', '¿Qué tan fácil fue leerlo?', 5, 'Muy difícil', 'Muy fácil'));
        sc.appendChild(single('lectura_pedirla', '¿La pedirías en voz alta en un bar sin miedo a pronunciarla mal?', ['Sí, sin problema', 'Con algo de duda', 'No, me daría pena']));
      }
    },
    {
      id: 'palabras',
      render: function (sc) {
        sc.appendChild(h('p', { class: 'kicker', text: 'Primera impresión' }));
        sc.appendChild(stage(ASSETS.logoSinDescriptor));
        var box = qbox('Sin pensarlo mucho: ¿qué tres palabras te vienen a la mente?', 'Lo primero que salga.');
        var st = h('div', { class: 'stack' });
        [1, 2, 3].forEach(function (n) {
          var t = text('palabra_' + n, null, { required: n === 1, placeholder: 'Palabra ' + n, requiredMsg: 'Escribe al menos una palabra.' });
          t.className = ''; st.appendChild(t);
        });
        box.appendChild(st); sc.appendChild(box);
      }
    },
    {
      id: 'categoria',
      render: function (sc) {
        sc.appendChild(h('p', { class: 'kicker', text: 'Primera impresión' }));
        sc.appendChild(stage(ASSETS.logoSinDescriptor));
        sc.appendChild(single('categoria', '¿Qué crees que vende esta marca?', ['Cerveza', 'Mezcal o tequila', 'Café', 'Ropa o calzado', 'Restaurante o bar', 'Música o eventos', 'Tecnología', 'Barbería o tatuajes'], { shuffle: true, other: 'Otra cosa' }));
        sc.appendChild(single('origen', '¿De dónde crees que es?', ['De Jalisco', 'De otra parte de México', 'De Estados Unidos', 'De Europa', 'De otro país de Latinoamérica', 'No sé'], { shuffle: true, fixedLast: ['No sé'] }));
        sc.appendChild(text('suena_a', '¿El nombre te suena a alguna palabra, idioma o lugar?', { help: 'Opcional. Por ejemplo, si te recuerda a otra palabra o a otro idioma.' }));
      }
    },
    {
      id: 'personalidad',
      render: function (sc) {
        sc.appendChild(h('p', { class: 'kicker', text: 'Personalidad' }));
        sc.appendChild(h('p', { class: 'help', text: 'Esta es la versión completa del logo.' }));
        sc.appendChild(stage(ASSETS.logoPrincipal));
        sc.appendChild(qbox('¿Cómo describirías a esta marca?', 'En cada par, toca el punto más cercano a lo que sientes. El punto del centro es «ni una ni otra».'));
        sc.appendChild(semdiff(PARES));
      }
    },
    {
      id: 'expectativas',
      render: function (sc) {
        sc.appendChild(h('p', { class: 'kicker', text: 'Expectativas' }));
        sc.appendChild(stage(ASSETS.logoPrincipal));
        sc.appendChild(h('p', { class: 'lead', text: 'Imagina una cerveza de 355 ml con este logo en la carta de un bar.' }));
        sc.appendChild(single('precio', '¿Cuánto esperarías que cueste?', ['Menos de $50', '$50 a $69', '$70 a $89', '$90 a $109', '$110 o más', 'No sé']));
        sc.appendChild(scale('curiosidad', '¿Qué tanta curiosidad te daría probarla?', 5, 'Ninguna', 'Mucha'));
        sc.appendChild(single('sabor_logo', '¿Cómo te imaginas que sabe?', ['Ligera y refrescante', 'Tostada, con notas de café o cacao', 'Amarga y lupulada', 'Afrutada o ácida', 'Dulce y maltosa', 'El logo no me da ninguna pista'], { shuffle: true, fixedLast: ['El logo no me da ninguna pista'] }));
        sc.appendChild(multi('ocasion', '¿En qué momento te la imaginas?', ['Con amigos en un bar', 'Acompañando una buena comida', 'Para regalar', 'En una fiesta', 'Para probar algo nuevo', 'En un momento tranquilo'], { max: 2, shuffle: true }));
      }
    },
    {
      id: 'isotipo',
      render: function (sc) {
        sc.appendChild(h('p', { class: 'kicker', text: 'El símbolo' }));
        sc.appendChild(stage(ASSETS.isotipo, { shape: 'square', cls: 'iso', label: 'Símbolo' }));
        sc.appendChild(h('p', { class: 'lead', text: 'Este símbolo es de la misma marca y puede aparecer solo, por ejemplo en redes sociales.' }));
        sc.appendChild(text('iso_que_ve', '¿Qué ves en este símbolo?', { required: true }));
        var cual = text('iso_parecido_cual', '¿A cuál?', { required: true, requiredMsg: 'Escribe a cuál te recuerda.' });
        cual.style.display = 'none'; cual._field.active = false;
        sc.appendChild(single('iso_parecido', '¿Te recuerda a algún logo, marca o escudo que ya exista?', ['No', 'Sí', 'No lo sé'], {
          onChange: function (v) { var on = v === 'Sí'; cual.style.display = on ? '' : 'none'; cual._field.active = on; }
        }));
        sc.appendChild(cual);
        sc.appendChild(text('estrella_recuerda', '¿La estrella te recuerda a algo o a algún lugar?', { help: 'Opcional.' }));
      }
    },
    {
      id: 'sello',
      render: function (sc) {
        R.sello_px = tamSello;
        sc.appendChild(h('p', { class: 'kicker', text: 'La corcholata' }));
        sc.appendChild(h('p', { class: 'lead', text: 'Esta pieza iría en la corcholata. Aquí la ves más o menos a tamaño real.' }));
        sc.appendChild(h('p', { class: 'help', text: 'Sin acercar la pantalla ni hacer zoom.' }));
        var st = h('div', { class: 'stage plain', role: 'img', 'aria-label': 'Sello de la corcholata' });
        st.appendChild(h('div', { style: { width: tamSello + 'px' }, html: ASSETS.sello }));
        sc.appendChild(st);
        sc.appendChild(text('sello_lee', 'Escribe todo lo que alcanzas a leer.', { required: true, help: 'Si no alcanzas a leer nada, escribe «nada».' }));
        sc.appendChild(scale('sello_claridad', '¿Qué tan claro se ve?', 5, 'Nada claro', 'Muy claro'));
        sc.appendChild(single('sello_relaciona', '¿Lo relacionas con el logo que viste antes?', ['Sí', 'Más o menos', 'No'], { cols: 3 }));
      }
    },
    {
      id: 'colores',
      render: function (sc) {
        R.color_orden = colorOrden.join(' / ');
        sc.appendChild(h('p', { class: 'kicker', text: 'Color' }));
        sc.appendChild(qbox('La marca puede ir sobre distintos colores. Para cada uno, ¿qué tipo de cerveza esperarías?', 'Elige una opción en cada tarjeta.'));
        colorOrden.forEach(function (k) {
          var card = h('div', { class: 'colorcard' });
          card.appendChild(stage(ASSETS.logoVar, { fondo: k, label: 'Logo sobre fondo ' + FONDOS[k].nombre }));
          var chips = h('div', { class: 'chips', role: 'radiogroup', 'aria-label': 'Fondo ' + FONDOS[k].nombre });
          var value = null, bs = [];
          SABORES.forEach(function (s) {
            var b = h('button', { type: 'button', class: 'chip', role: 'radio', 'aria-checked': 'false', text: s });
            b.onclick = function () { value = s; bs.forEach(function (x) { x.setAttribute('aria-checked', x === b ? 'true' : 'false'); }); card.classList.remove('has-err'); };
            chips.appendChild(b); bs.push(b);
          });
          card.appendChild(chips);
          sc.appendChild(card);
          register({ box: card, quiet: true, validate: function () { return value ? null : 'x'; }, collect: function () { R['color_' + k] = value; } });
        });
      }
    },
    {
      id: 'colores_eleccion',
      render: function (sc) {
        sc.appendChild(h('p', { class: 'kicker', text: 'Color' }));
        function items() {
          return colorOrden.map(function (k) { return { id: k, label: FONDOS[k].nombre, el: function () { return stage(ASSETS.logoVar, { fondo: k }); } }; });
        }
        sc.appendChild(pickImage('color_tomaria', 'Si las vieras juntas en un refrigerador, ¿cuál tomarías primero?', items()));
        sc.appendChild(pickImage('color_calidad', '¿Cuál se ve de mayor calidad?', items()));
      }
    },
    {
      id: 'revelacion',
      render: function (sc) {
        sc.appendChild(h('p', { class: 'kicker', text: 'Te contamos' }));
        sc.appendChild(h('h1', { text: 'Ahora sí, el contexto' }));
        var box = h('div', { class: 'reveal' });
        CONFIG.revelacion.forEach(function (t, i) { box.appendChild(h('p', null, h('b', { text: String(i + 1) }), h('span', { text: t }))); });
        sc.appendChild(box);
        sc.appendChild(scale('revel_cambia', 'Saber esto, ¿cambia lo que piensas de la marca?', 5, 'Mucho peor', 'Mucho mejor', { help: 'El 3 es «igual».' }));
        sc.appendChild(scale('revel_apropiado', '¿Qué tan apropiado te parece que una cervecería use un nombre de origen wixárika?', 5, 'Nada apropiado', 'Muy apropiado', { extra: 'No sé' }));
        sc.appendChild(text('revel_porque', '¿Por qué? Y si te parece delicado, ¿qué lo haría respetuoso?', { multiline: true, help: 'Opcional, pero nos ayuda mucho.' }));
      }
    },
    {
      id: 'abiertas',
      render: function (sc) {
        sc.appendChild(h('p', { class: 'kicker', text: 'Casi terminamos' }));
        sc.appendChild(text('cambiaria', 'Si pudieras cambiar una sola cosa del logo, ¿qué sería?', { multiline: true, help: 'Opcional.' }));
        sc.appendChild(text('frase_amigo', '¿Cómo le describirías esta marca a un amigo, en una frase?', { help: 'Opcional.' }));
        sc.appendChild(text('comentario', '¿Algo más que quieras decirnos?', { multiline: true, help: 'Opcional.' }));
      }
    },
    {
      id: 'perfil',
      render: function (sc) {
        sc.appendChild(h('p', { class: 'kicker', text: 'Sobre ti' }));
        sc.appendChild(h('p', { class: 'help', text: 'Solo para comparar respuestas por grupos. Nada de esto te identifica.' }));
        sc.appendChild(single('edad', '¿Qué edad tienes?', ['18 a 24', '25 a 34', '35 a 44', '45 a 54', '55 o más'], { cols: 2 }));
        sc.appendChild(single('genero', '¿Con qué género te identificas?', ['Mujer', 'Hombre', 'Otro', 'Prefiero no decir'], { required: false, help: 'Opcional.', cols: 2 }));
        sc.appendChild(single('vive', '¿Dónde vives?', ['Zapopan', 'Guadalajara', 'Tlaquepaque', 'Tonalá', 'Tlajomulco', 'Otra parte de Jalisco', 'Otro estado', 'Otro país'], { cols: 2 }));
        sc.appendChild(single('frecuencia', '¿Qué tan seguido tomas cerveza artesanal?', ['Nunca o casi nunca', 'Algunas veces al año', 'Una a tres veces al mes', 'Cada semana']));
        sc.appendChild(single('trabaja_en', '¿Trabajas o estudias diseño, publicidad o marketing, o trabajas en la industria cervecera?', ['Sí', 'No'], { cols: 2 }));
        sc.appendChild(single('conoce_proyecto', '¿Conoces a alguien del proyecto?', ['Sí', 'No'], { cols: 2 }));
        sc.appendChild(single('visto_antes', '¿Habías visto este logo antes de hoy?', ['Sí', 'Me suena', 'No'], { cols: 3 }));
      }
    },
    {
      id: 'codigo', btn: 'Enviar respuestas',
      render: function (sc) {
        sc.appendChild(h('p', { class: 'kicker', text: 'Último paso' }));
        sc.appendChild(h('h1', { text: 'Una clave para mañana' }));
        sc.appendChild(h('p', { class: 'lead', text: 'Mañana hay una segunda parte de 1 minuto; al terminar te damos opción de recordártela. Esta clave une tus dos respuestas sin pedirte datos.' }));
        var box = h('div', { class: 'reveal' }, h('p', null, h('span', { text: 'Las 2 primeras letras del nombre de tu mamá + el día del mes en que naciste. Si se llama Martha y naciste el 14, tu clave es MA14.' })));
        sc.appendChild(box);
        sc.appendChild(text('codigo', 'Tu clave', { help: 'Opcional.', placeholder: 'MA14', caps: 'characters', max: 12, transform: function (v) { return v.toUpperCase().replace(/\s+/g, ''); } }));
      },
      onNext: function () { return 'enviar'; }
    },
    { id: 'enviar', auto: true, render: function (sc) { send(sc, 'gracias'); } },
    {
      id: 'gracias', terminal: true,
      render: function (sc) {
        sc.className += ' center';
        sc.appendChild(h('div', { class: 'big-ok', 'aria-hidden': 'true', text: '✓' }));
        sc.appendChild(h('h1', { text: 'Gracias, ya llegaron tus respuestas' }));
        sc.appendChild(h('p', { class: 'lead', text: 'Un favor: no le enseñes el logo a nadie que todavía no conteste. Queremos su primera impresión, igual que la tuya.' }));
        recordatorio(sc);
        previewDump(sc);
      }
    },
    {
      id: 'menor', terminal: true,
      render: function (sc) {
        sc.appendChild(h('h1', { text: 'Gracias por tu interés' }));
        sc.appendChild(h('p', { class: 'lead', text: 'Esta encuesta es sobre una bebida alcohólica y solo puede contestarla gente mayor de edad. No guardamos nada de lo que marcaste.' }));
      }
    }
  ];

  // ── Parte 2 (al día siguiente) ───────────────────────────────────
  var PARTE2 = [
    {
      id: 'p2_intro', btn: 'Empezar',
      render: function (sc) {
        sc.appendChild(h('p', { class: 'kicker', text: 'Segunda parte · 1 minuto' }));
        sc.appendChild(h('h1', { text: 'Hola de nuevo' }));
        sc.appendChild(h('p', { class: 'lead', text: 'Son unas preguntas rápidas sobre la encuesta que contestaste antes. No la busques ni regreses a verla: nos interesa justo lo que se te quedó.' }));
        sc.appendChild(single('mayor_de_edad', '¿Tienes 18 años o más?', ['Sí', 'No'], { cols: 2 }));
      },
      onNext: function () { return R.mayor_de_edad === 'No' ? 'menor' : null; }
    },
    {
      id: 'p2_nombre',
      render: function (sc) {
        sc.appendChild(text('p2_nombre', '¿Cómo se llamaba la marca?', { required: true, caps: 'none', help: 'Escríbelo como creas que se escribe. Si no te acuerdas, escribe «no me acuerdo».' }));
        sc.appendChild(text('p2_descripcion', 'Describe el logo como se lo describirías a alguien que no lo ha visto.', { multiline: true, required: true }));
      }
    },
    {
      id: 'p2_elementos',
      render: function (sc) {
        sc.appendChild(multi('p2_elementos', '¿Cuáles de estos elementos tenía el logo o el símbolo?', ['Una letra Y grande', 'Una estrella', 'Un círculo con letras alrededor', 'Letras con picos o ángulos', 'Un sol', 'Una montaña', 'Una ola', 'Un agave', 'Un animal', 'Espigas de cebada'], { shuffle: true, exclusive: ['No recuerdo'] }));
        sc.appendChild(multi('p2_colores', '¿Qué colores recuerdas del logo principal?', ['Negro o gris muy oscuro', 'Blanco o crema', 'Azul', 'Naranja', 'Morado', 'Verde', 'Rojo', 'Amarillo'], { shuffle: true, exclusive: ['No recuerdo'] }));
      }
    },
    {
      id: 'p2_cierre', btn: 'Enviar',
      render: function (sc) {
        sc.appendChild(scale('p2_curiosidad', 'Hoy, ¿qué tanta curiosidad te da probarla?', 5, 'Ninguna', 'Mucha'));
        sc.appendChild(h('div', { class: 'reveal' }, h('p', null, h('span', { text: 'Tu clave: las 2 primeras letras del nombre de tu mamá + el día del mes en que naciste. Ejemplo: MA14.' }))));
        sc.appendChild(text('codigo', 'Tu clave', { help: 'Opcional. La misma que pusiste la primera vez.', placeholder: 'MA14', caps: 'characters', max: 12, transform: function (v) { return v.toUpperCase().replace(/\s+/g, ''); } }));
      },
      onNext: function () { return 'enviar'; }
    },
    { id: 'enviar', auto: true, render: function (sc) { send(sc, 'gracias'); } },
    {
      id: 'gracias', terminal: true,
      render: function (sc) {
        sc.className += ' center';
        sc.appendChild(h('div', { class: 'big-ok', 'aria-hidden': 'true', text: '✓' }));
        sc.appendChild(h('h1', { text: 'Listo, gracias' }));
        sc.appendChild(h('p', { class: 'lead', text: 'Con esto terminamos. Nos ayudaste más de lo que crees.' }));
        previewDump(sc);
      }
    },
    PARTE1[PARTE1.length - 1]
  ];

  function start(parte) {
    R.parte = parte;
    steps = parte === 2 ? PARTE2 : PARTE1;
    go(0);
  }
  if (GAS && google.script.url) {
    google.script.url.getLocation(function (loc) { start(loc && loc.parameter && loc.parameter.p === '2' ? 2 : 1); });
  } else {
    start(params.p === '2' ? 2 : 1);
  }
})();

</script>
</body>
</html>
